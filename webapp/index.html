<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gift Radar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0e1014;
    --surface: #171a21;
    --surface-2: #1f232c;
    --line: #272c37;
    --text: #f2f4f8;
    --muted: #8a92a3;
    --accent: #3d8bfd;
    --accent-soft: rgba(61, 139, 253, .14);
    --green: #34c759;
    --red: #ff5a5f;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding-bottom: calc(76px + env(safe-area-inset-bottom));
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input { font: inherit; color: var(--text); }
  img { display: block; }
  .ton { width: 13px; height: 13px; flex: none; }
  .muted { color: var(--muted); }

  /* шапка */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 16px 10px; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.3px; display: flex; align-items: center; gap: 10px; }
  .top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(52,199,89,.18); }
  .live.off { background: var(--muted); box-shadow: none; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 13px; border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 500; border: 1px solid transparent; }
  .chip.on { background: var(--accent-soft); color: var(--accent); border-color: rgba(61,139,253,.35); }

  /* лента */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 16px 16px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { background: var(--surface); border-radius: var(--radius); overflow: hidden; text-align: left; display: flex; flex-direction: column; }
  .card .pic { position: relative; aspect-ratio: 1; background: var(--surface-2); }
  .card .pic img { width: 100%; height: 100%; object-fit: cover; }
  .tag { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); }
  .ago { position: absolute; right: 8px; top: 8px; font-size: 11px; padding: 3px 7px; border-radius: 999px; background: rgba(0,0,0,.55); }
  .card .body { padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
  .card .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .num { color: var(--muted); font-weight: 500; }
  .card .attr { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { margin-top: 7px; display: flex; align-items: center; justify-content: center; gap: 5px; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; border-radius: 10px; padding: 7px 8px; }

  /* фильтры */
  .list { padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .fcard { background: var(--surface); border-radius: var(--radius); padding: 14px; }
  .fcard.off { opacity: .55; }
  .fhead { display: flex; align-items: center; gap: 12px; }
  .thumbs { display: flex; flex: none; }
  .thumbs img, .thumbs .any { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); border: 2px solid var(--surface); object-fit: cover; }
  .thumbs > * + * { margin-left: -14px; }
  .thumbs .any { display: grid; place-items: center; font-size: 20px; }
  .ftitle { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ftags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ftag { font-size: 12px; padding: 4px 9px; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
  .ftag b { color: var(--text); font-weight: 500; }
  .factions { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; padding: 10px; border-radius: 12px; background: var(--surface-2); font-weight: 600; font-size: 14px; text-align: center; }
  .btn.danger { color: var(--red); flex: none; padding: 10px 14px; }
  .switch { width: 44px; height: 26px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
  .switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch.on { background: var(--green); }
  .switch.on::after { transform: translateX(18px); }

  /* нижняя панель */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: rgba(14,16,20,.92); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: 11px; font-weight: 500; }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--accent); }

  .primary { display: block; width: 100%; padding: 14px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; text-align: center; }
  .primary:disabled { opacity: .5; }
  .sticky-bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }

  .empty { text-align: center; color: var(--muted); padding: 60px 24px; }
  .empty .big { font-size: 44px; margin-bottom: 10px; }
  .empty b { color: var(--text); display: block; font-size: 17px; margin-bottom: 4px; }

  /* редактор */
  .page { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-bottom: 100px; }
  .page-head { position: sticky; top: 0; background: var(--bg); z-index: 2; display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
  .page-head h2 { margin: 0; font-size: 18px; flex: 1; }
  .back { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; }
  .section-title { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .4px; padding: 14px 16px 8px; }
  .group { margin: 0 16px; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; width: 100%; text-align: left; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .label { flex: 1; font-weight: 500; }
  .row .value { color: var(--muted); max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .row .value.set { color: var(--accent); }
  .row.disabled { opacity: .45; }
  .chev { color: var(--muted); flex: none; }
  .icon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; font-size: 16px; background: var(--surface-2); }
  .prices { display: flex; gap: 10px; padding: 0 16px; }
  .field { flex: 1; background: var(--surface); border-radius: 14px; padding: 9px 13px; }
  .field label { display: block; font-size: 12px; color: var(--muted); }
  .field input { width: 100%; background: none; border: 0; outline: 0; font-size: 17px; font-weight: 600; padding: 2px 0 0; }
  .field .in { display: flex; align-items: center; gap: 6px; }
  .mchips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px; }
  .hint { color: var(--muted); font-size: 12px; padding: 8px 16px 0; }

  /* шторка выбора */
  .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); animation: fade .15s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; top: 6vh; z-index: 41; background: var(--surface); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  .sheet-head { padding: 10px 16px 0; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
  .sheet-title { display: flex; align-items: center; justify-content: space-between; }
  .sheet-title h3 { margin: 0; font-size: 18px; }
  .link { color: var(--accent); font-weight: 500; font-size: 15px; }
  .search { display: flex; align-items: center; gap: 8px; margin: 12px 0 8px; background: var(--surface-2); border-radius: 12px; padding: 9px 12px; }
  .search input { flex: 1; background: none; border: 0; outline: 0; font-size: 15px; }
  .sort { display: flex; gap: 6px; padding-bottom: 8px; }
  .sort .chip { padding: 5px 11px; font-size: 13px; background: var(--surface-2); }
  .sort .chip.on { background: var(--accent-soft); }
  .options { flex: 1; overflow-y: auto; padding: 0 8px 90px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; border-radius: 12px; text-align: left; }
  .opt.on { background: var(--accent-soft); }
  .opt .pic { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); flex: none; object-fit: cover; overflow: hidden; }
  .opt .pic.round { border-radius: 50%; }
  .opt .pic.letter { display: grid; place-items: center; font-weight: 700; color: var(--muted); }
  .opt .txt { flex: 1; min-width: 0; }
  .opt .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt .t2 { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; margin-top: 1px; }
  .rar { font-size: 12px; font-weight: 600; padding: 3px 7px; border-radius: 7px; background: var(--surface-2); color: var(--muted); flex: none; }
  .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
  .opt.on .check { background: var(--accent); border-color: var(--accent); }
  .group-label { padding: 12px 8px 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }

  .status { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .srow { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .srow .err { font-size: 12px; color: var(--red); word-break: break-word; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 60; background: #2b303b; padding: 10px 16px; border-radius: 12px; font-weight: 500; font-size: 14px; animation: fade .2s; }
  /* анализ выгодности */
  .disc { position: absolute; left: 8px; bottom: 8px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.6); }
  .disc.good { background: var(--green); color: #04130a; }
  .disc.bad { background: rgba(255,90,95,.85); color: #fff; }
  .card .profit { font-size: 12px; font-weight: 600; margin-top: 4px; text-align: center; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .drow { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 14px; padding: 10px; width: 100%; text-align: left; }
  .drow img, .drow .ph { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--surface-2); flex: none; }
  .drow .txt { flex: 1; min-width: 0; }
  .drow .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drow .t2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .drow .roi { text-align: right; flex: none; }
  .drow .roi b { display: block; font-size: 15px; }
  .drow .roi span { font-size: 12px; }
  .hunt { margin: 0 16px; background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .hunt .line { display: flex; align-items: center; gap: 12px; }
  .hunt .line .label { flex: 1; font-weight: 600; }
  .hunt .note { font-size: 12px; color: var(--muted); }
  .hunt .prices { padding: 0; }
  .hunt .field { background: var(--surface-2); }
  .roi-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .roi-chips .chip { padding: 6px 12px; font-size: 13px; background: var(--surface-2); }
  .roi-chips .chip.on { background: var(--accent-soft); }
  .detail-pic { margin: 0 16px; border-radius: 20px; overflow: hidden; aspect-ratio: 1; max-height: 340px; background: var(--surface-2); position: relative; }
  .detail-pic img { width: 100%; height: 100%; object-fit: cover; }
  .detail-title { padding: 14px 16px 2px; font-size: 20px; font-weight: 700; }
  .detail-sub { padding: 0 16px; color: var(--muted); font-size: 13px; }
  .verdict { margin: 14px 16px 0; border-radius: 14px; padding: 12px 14px; font-weight: 700; }
  .verdict.buy { background: rgba(52,199,89,.15); color: var(--green); }
  .verdict.maybe { background: rgba(255,196,0,.13); color: #ffc400; }
  .verdict.skip { background: rgba(255,90,95,.13); color: var(--red); }
  .verdict.unknown { background: var(--surface); color: var(--muted); }
  .verdict ul { margin: 6px 0 0; padding-left: 18px; font-weight: 400; font-size: 13px; color: var(--text); opacity: .85; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; }
  .kv + .kv { border-top: 1px solid var(--line); }
  .kv .k { color: var(--muted); }
  .kv .v { font-weight: 600; text-align: right; }
  .btns { display: flex; gap: 8px; padding: 14px 16px 0; }
  .skeleton { background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: var(--radius); }
  @keyframes sh { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
const tg = window.Telegram?.WebApp;
const TON = '<svg class="ton" viewBox="0 0 24 24" fill="none"><path d="M4.3 6h15.4c.9 0 1.5 1 1 1.8l-7.8 13.4a1 1 0 0 1-1.8 0L3.3 7.8C2.8 7 3.4 6 4.3 6Z" stroke="currentColor" stroke-width="2"/><path d="M12 6v15" stroke="currentColor" stroke-width="2"/></svg>';
const ICONS = {
  feed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>',
  filters: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  status: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  deals: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.6 1.2 2.5 2 2.5-.7-3 .2-5.8 1-8Z"/></svg>',
  back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a92a3" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg>',
};

const S = {
  tab: 'feed', meta: null, feed: null, filters: null, status: null, deals: null, hunt: null,
  collections: null, backdrops: null, feedMarket: '',
  editor: null, sheet: null, detail: null, timer: null,
};
const TABS = {
  feed: ['Лента', 'Подарки, найденные по вашим фильтрам'],
  deals: ['Выгодно', 'Лоты, которые можно перепродать в плюс'],
  filters: ['Фильтры', 'Что отслеживать на площадках'],
  status: ['Площадки', 'Состояние мониторинга'],
};
const VERDICT = { buy: '🟢 Брать — перепродажа в плюс', maybe: '🟡 Можно, но есть риски', skip: '🔴 Не выгодно', unknown: '⚪ Мало данных для оценки' };
const LIQ = { high: 'высокая', mid: 'средняя', low: 'низкая' };
const CONF = { high: 'высокая', mid: 'средняя', low: 'низкая' };
const signed = n => (n >= 0 ? '+' : '−') + fmt(Math.abs(n));
const pct = r => (r >= 0 ? '+' : '−') + Math.abs(Math.round(r * 100)) + '%';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '—' : (+n).toLocaleString('ru-RU', {maximumFractionDigits: 2});
const haptic = t => { try { tg?.HapticFeedback?.selectionChanged(); if (t) tg.HapticFeedback.notificationOccurred(t); } catch {} };
const norm = s => String(s || '').toLowerCase().replace(/’/g, "'").replace(/\s+/g, ' ').trim();

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg?.initData || '', 'ngrok-skip-browser-warning': '1', ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) throw new Error('auth');
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function toast(text) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

function ago(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return 'сейчас';
  if (s < 3600) return Math.floor(s / 60) + ' мин';
  if (s < 86400) return Math.floor(s / 3600) + ' ч';
  return Math.floor(s / 86400) + ' д';
}
const agoLong = ts => { const a = ago(ts); return a === 'сейчас' ? 'только что' : a + ' назад'; };

function openLink(url) {
  if (!url) return;
  if (tg && url.startsWith('https://t.me/')) tg.openTelegramLink(url);
  else if (tg) tg.openLink(url);
  else window.open(url, '_blank');
}

const collByName = name => S.collections?.find(c => norm(c.name) === norm(name));

// ---------- загрузка ----------
async function loadTab() {
  try {
    if (S.tab === 'feed') S.feed = await api('/api/feed?limit=150');
    if (S.tab === 'filters') S.filters = await api('/api/filters');
    if (S.tab === 'status') S.status = await api('/api/status');
    if (S.tab === 'deals') [S.deals, S.hunt] = await Promise.all([api('/api/deals?hours=24'), api('/api/hunt')]);
  } catch (e) {
    if (e.message === 'auth') return renderAuthError();
    toast('Не удалось загрузить: ' + e.message);
  }
  render();
}

// ---------- отрисовка ----------
function render() {
  const app = document.getElementById('app');
  const paused = S.meta?.paused;
  let html = `<div class="top">
      <h1><span class="live ${paused ? 'off' : ''}"></span>${TABS[S.tab][0]}</h1>
      <div class="sub">${paused ? 'Уведомления на паузе' : TABS[S.tab][1]}</div>
    </div>`;
  if (S.tab === 'feed') html += renderFeed();
  if (S.tab === 'deals') html += renderDeals();
  if (S.tab === 'filters') html += renderFilters();
  if (S.tab === 'status') html += renderStatus();
  html += `<nav class="tabs">${Object.keys(TABS).map(t =>
    `<button class="tab ${S.tab === t ? 'on' : ''}" data-tab="${t}">${ICONS[t]}${TABS[t][0]}</button>`).join('')}</nav>`;
  if (S.detail) html += renderDetail(S.detail);
  if (S.editor) html += renderEditor();
  if (S.sheet) html += renderSheet();
  app.innerHTML = html;
  const search = document.getElementById('sheet-search');
  if (search && S.sheet.focus) { search.focus(); search.setSelectionRange(search.value.length, search.value.length); S.sheet.focus = false; }
  syncBackButton();
}

function renderFeed() {
  const markets = S.meta?.markets || {};
  let html = `<div class="chips">
    <button class="chip ${!S.feedMarket ? 'on' : ''}" data-feed-market="">Все</button>
    ${Object.entries(markets).map(([k, v]) => `<button class="chip ${S.feedMarket === k ? 'on' : ''}" data-feed-market="${k}">${esc(v)}</button>`).join('')}
  </div>`;
  if (!S.feed) return html + `<div class="grid">${'<div class="skeleton" style="aspect-ratio:.72"></div>'.repeat(6)}</div>`;
  const items = S.feed.filter(i => !S.feedMarket || i.market === S.feedMarket);
  if (!items.length) {
    return html + `<div class="empty"><div class="big">🎁</div><b>Пока ничего не найдено</b>
      Как только на площадке выставят подарок под ваш фильтр, он появится здесь и придёт в чат.</div>`;
  }
  return html + `<div class="grid">${items.map(i => {
    const a = i.analysis;
    const disc = a?.discount != null
      ? `<span class="disc ${a.discount >= 0.05 ? 'good' : a.discount < 0 ? 'bad' : ''}">${a.discount >= 0 ? '−' : '+'}${Math.abs(Math.round(a.discount * 100))}%</span>` : '';
    const profit = a?.ok
      ? `<div class="profit ${a.profit >= 0 ? 'pos' : 'neg'}">${{buy: '🟢', maybe: '🟡', skip: '🔴'}[a.verdict] || ''} ${signed(a.profit)} TON (${pct(a.roi)})</div>` : '';
    return `
    <button class="card" data-hit="${i.id}">
      <div class="pic">
        ${i.image ? `<img src="${esc(i.image)}" loading="lazy" alt="">` : ''}
        <span class="tag">${i.deal ? '🔥 ' : ''}${esc(markets[i.market] || i.market)}</span>
        <span class="ago">${ago(i.ts)}</span>
        ${disc}
      </div>
      <div class="body">
        <div class="name">${esc(i.collection)} <span class="num">#${esc(i.number ?? '')}</span></div>
        <div class="attr">${esc([i.model, i.backdrop].filter(Boolean).join(' · ') || ' ')}</div>
        <div class="attr">${esc(i.symbol || ' ')}</div>
        <div class="price">${priceHtml(i)}</div>
        ${profit}
      </div>
    </button>`;
  }).join('')}</div>`;
}

function priceHtml(i) {
  return i.price_text && !/TON$/.test(i.price_text) ? esc(i.price_text) : TON + ' ' + esc((i.price_text || '').replace(/\s*TON$/, ''));
}

// ---------- шторка выбора ----------
async function openSheet(kind) {
  const f = S.editor;
  if (kind === 'models' && !f.collections.length) { toast('Сначала выберите коллекцию'); return; }
  S.sheet = { kind, q: '', sort: kind === 'collections' ? 'popular' : 'rarity', selected: new Set(f[kind]), options: null, focus: false };
  render();
  try {
    if (kind === 'collections') {
      S.sheet.options = S.collections || (S.collections = await api('/api/collections'));
    } else if (kind === 'backdrops') {
      S.sheet.options = S.backdrops || (S.backdrops = await api('/api/backdrops'));
    } else {
      const shorts = f.collections.map(n => collByName(n)?.short).filter(Boolean);
      const attrs = await api('/api/attributes?collections=' + encodeURIComponent(shorts.join(',')));
      S.sheet.options = attrs[kind];
      S.sheet.grouped = shorts.length > 1;
    }
  } catch (e) { toast('Не удалось загрузить список'); S.sheet = null; }
  render();
}

function sheetOptions() {
  const sh = S.sheet;
  let opts = (sh.options || []).filter(o => !sh.q || norm(o.name).includes(norm(sh.q)) || norm(o.collection).includes(norm(sh.q)));
  const by = {
    popular: () => 0,
    name: (a, b) => a.name.localeCompare(b.name),
    floor: (a, b) => (a.floor ?? 1e12) - (b.floor ?? 1e12),
    floorDesc: (a, b) => (b.floor ?? -1) - (a.floor ?? -1),
    rarity: (a, b) => (a.rarity || 99) - (b.rarity || 99),
  }[sh.sort];
  opts = [...opts].sort((a, b) => (sh.grouped ? (a.collection || '').localeCompare(b.collection || '') : 0) || by(a, b));
  // выбранные — наверх
  return [...opts.filter(o => sh.selected.has(o.name)), ...opts.filter(o => !sh.selected.has(o.name))];
}

function optionPic(kind, o) {
  if (kind === 'collections' || kind === 'models') return `<img class="pic" src="${esc(o.image)}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">`;
  if (kind === 'backdrops') {
    const bg = o.center ? `radial-gradient(circle, ${o.center} 0%, ${o.edge || o.center} 100%)` : 'var(--surface-2)';
    return `<span class="pic round" style="background:${bg}"></span>`;
  }
  if (o.image) return `<span class="pic" style="display:grid;place-items:center"><img src="${esc(o.image)}" loading="lazy" alt="" style="width:28px;height:28px;filter:invert(1) opacity(.85)" onerror="this.style.visibility='hidden'"></span>`;
  return `<span class="pic letter">${esc(o.name[0])}</span>`;
}

function optionText(kind, o) {
  const parts = [];
  if (kind === 'collections') {
    parts.push(`${TON} ${fmt(o.floor)}`);
    parts.push(`· ${fmt(o.listed)} в продаже`);
  } else if (o.floor != null) {
    parts.push(`${TON} ${fmt(o.floor)}`);
  }
  return parts.join(' ');
}

function renderSheet() {
  const sh = S.sheet;
  const titles = { collections: 'Коллекции', models: 'Модели', backdrops: 'Фоны', symbols: 'Символы' };
  const sorts = sh.kind === 'collections'
    ? [['popular', 'Популярные'], ['floor', 'Флор ↑'], ['floorDesc', 'Флор ↓'], ['name', 'А–Я']]
    : [['rarity', 'Редкие'], ['floor', 'Флор ↑'], ['floorDesc', 'Флор ↓'], ['name', 'А–Я']];
  let body;
  if (!sh.options) {
    body = '<div style="padding:8px">' + '<div class="skeleton" style="height:56px;margin-bottom:8px"></div>'.repeat(8) + '</div>';
  } else {
    const opts = sheetOptions();
    if (!opts.length) body = `<div class="empty">Ничего не найдено</div>`;
    else {
      let lastGroup = null;
      body = opts.map(o => {
        let head = '';
        if (sh.grouped && !sh.selected.has(o.name) && o.collection !== lastGroup) { lastGroup = o.collection; head = `<div class="group-label">${esc(o.collection)}</div>`; }
        const on = sh.selected.has(o.name);
        return `${head}<button class="opt ${on ? 'on' : ''}" data-opt="${esc(o.name)}">
          ${optionPic(sh.kind, o)}
          <span class="txt"><div class="t1">${esc(o.name)}</div><div class="t2">${optionText(sh.kind, o)}</div></span>
          ${o.rarity ? `<span class="rar">${fmt(o.rarity)}%</span>` : ''}
          <span class="check">${on ? ICONS.check : ''}</span>
        </button>`;
      }).join('');
    }
  }
  const n = sh.selected.size;
  return `<div class="sheet-bg" data-close-sheet></div>
  <div class="sheet">
    <div class="sheet-head">
      <div class="grab"></div>
      <div class="sheet-title"><h3>${titles[sh.kind]}</h3><button class="link" data-reset>Сбросить</button></div>
      <label class="search">${ICONS.search}<input id="sheet-search" placeholder="Поиск" value="${esc(sh.q)}" autocomplete="off"></label>
      <div class="sort">${sorts.map(([k, v]) => `<button class="chip ${sh.sort === k ? 'on' : ''}" data-sort="${k}">${v}</button>`).join('')}</div>
    </div>
    <div class="options">${body}</div>
    <div class="sticky-bottom"><button class="primary" data-sheet-done>${n ? `Выбрать (${n})` : 'Любые'}</button></div>
  </div>`;
}

function closeSheet(apply) {
  const sh = S.sheet;
  if (apply && sh) {
    S.editor[sh.kind] = [...sh.selected];
    // если поменяли коллекции — выкинем модели и символы, которых в них больше нет
    if (sh.kind === 'collections') {
      if (!S.editor.collections.length) S.editor.models = [];
    }
  }
  S.sheet = null;
  render();
}

// ---------- кнопка «назад» Telegram ----------
function syncBackButton() {
  if (!tg?.BackButton) return;
  if (S.sheet || S.editor || S.detail) tg.BackButton.show(); else tg.BackButton.hide();
}
function goBack() {
  if (S.sheet) closeSheet(false);
  else if (S.editor) { S.editor = null; render(); }
  else if (S.detail) { S.detail = null; render(); }
}

function huntFields() {
  const patch = {};
  document.querySelectorAll('[data-hunt-field]').forEach(inp => { patch[inp.dataset.huntField] = inp.value.trim().replace(',', '.'); });
  return patch;
}

async function saveHunt(patch) {
  try {
    S.hunt = await api('/api/hunt', { method: 'POST', body: patch });
    haptic('success'); render(); return true;
  } catch { toast('Проверьте числа'); return false; }
}

// ---------- действия ----------
function readEditorFields() {
  document.querySelectorAll('[data-field]').forEach(inp => {
    const raw = inp.value.trim().replace(',', '.');
    S.editor[inp.dataset.field] = raw === '' ? null : Number(raw);
  });
}

async function saveEditor() {
  readEditorFields();
  const f = S.editor;
  for (const k of ['min_price', 'max_price', 'max_number']) {
    if (f[k] != null && (isNaN(f[k]) || f[k] < 0)) { toast('Проверьте числа'); return; }
  }
  if (f.min_price != null && f.max_price != null && f.min_price > f.max_price) { toast('«От» больше, чем «До»'); return; }
  try {
    if (f.id) await api('/api/filters/' + f.id, { method: 'PUT', body: f });
    else await api('/api/filters', { method: 'POST', body: f });
    haptic('success');
    S.editor = null;
    toast('Фильтр сохранён');
    S.tab = 'filters';
    await loadTab();
  } catch { toast('Не удалось сохранить'); }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('button, [data-close-sheet]');
  if (!el) return;
  const d = el.dataset;

  if (d.tab) { S.tab = d.tab; haptic(); render(); loadTab(); return; }
  if ('feedMarket' in d) { S.feedMarket = d.feedMarket; render(); return; }
  if (d.hit) { S.detail = findHit(d.hit); haptic(); render(); document.querySelector('.page')?.scrollTo(0, 0); return; }
  if ('closeDetail' in d) { S.detail = null; render(); return; }
  if (d.open) { openLink(d.open); return; }
  if (d.reanalyze) {
    el.disabled = true; el.textContent = 'Считаю…';
    try {
      const fresh = await api('/api/reanalyze/' + d.reanalyze, { method: 'POST' });
      for (const list of [S.feed, S.deals]) { const i = list?.findIndex(h => h.id == fresh.id); if (i >= 0) list[i] = fresh; }
      S.detail = fresh; haptic('success'); toast('Пересчитано');
    } catch { toast('Не удалось пересчитать'); }
    render(); return;
  }
  if ('huntToggle' in d) { saveHunt({ enabled: !S.hunt.enabled }); return; }
  if ('huntLiq' in d) { saveHunt({ only_liquid: !S.hunt.only_liquid }); return; }
  if (d.huntRoi) { saveHunt({ ...huntFields(), min_roi: +d.huntRoi }); return; }
  if ('huntSave' in d) { if (await saveHunt(huntFields())) toast('Пороги сохранены'); return; }

  if ('new' in d) {
    S.editor = { id: null, collections: [], models: [], backdrops: [], symbols: [], min_price: null, max_price: null, max_number: null, markets: [], enabled: true };
    render(); return;
  }
  if (d.edit) { S.editor = JSON.parse(JSON.stringify(S.filters.find(f => f.id == d.edit))); render(); return; }
  if (d.toggle) {
    const f = S.filters.find(x => x.id == d.toggle);
    f.enabled = !f.enabled; haptic(); render();
    try { await api('/api/filters/' + f.id, { method: 'PUT', body: f }); } catch { toast('Не удалось сохранить'); }
    return;
  }
  if (d.del) {
    const ok = await new Promise(r => tg?.showConfirm ? tg.showConfirm('Удалить фильтр?', r) : r(confirm('Удалить фильтр?')));
    if (!ok) return;
    await api('/api/filters/' + d.del, { method: 'DELETE' });
    S.filters = S.filters.filter(f => f.id != d.del); haptic('success'); render(); return;
  }
  if ('pause' in d) {
    const paused = !S.status.paused;
    const r = await api('/api/pause', { method: 'POST', body: { paused } });
    S.status.paused = r.paused; S.meta.paused = r.paused; haptic(); render(); return;
  }

  // редактор
  if ('closeEditor' in d) { S.editor = null; render(); return; }
  if (d.pick) { readEditorFields(); openSheet(d.pick); return; }
  if ('market' in d) {
    readEditorFields();
    const m = d.market, list = S.editor.markets;
    S.editor.markets = !m ? [] : list.includes(m) ? list.filter(x => x !== m) : [...list, m];
    haptic(); render(); return;
  }
  if ('save' in d) { saveEditor(); return; }

  // шторка
  if ('closeSheet' in d) { closeSheet(false); return; }
  if ('reset' in d) { S.sheet.selected.clear(); haptic(); render(); return; }
  if (d.sort) { S.sheet.sort = d.sort; render(); return; }
  if ('sheetDone' in d) { closeSheet(true); return; }
  if (d.opt != null) {
    const sel = S.sheet.selected;
    sel.has(d.opt) ? sel.delete(d.opt) : sel.add(d.opt);
    haptic();
    const scroll = document.querySelector('.options')?.scrollTop;
    render();
    const o = document.querySelector('.options'); if (o) o.scrollTop = scroll;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'sheet-search') { S.sheet.q = e.target.value; S.sheet.focus = true; render(); }
});

function renderAuthError() {
  document.getElementById('app').innerHTML = `<div class="empty"><div class="big">🔒</div><b>Нет доступа</b>
    Откройте приложение через кнопку в своём боте. Оно доступно только владельцу.</div>`;
}

async function init() {
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#0e1014'); tg.setBackgroundColor('#0e1014'); tg.setBottomBarColor?.('#0e1014'); } catch {}
    tg.BackButton?.onClick(goBack);
  }
  render();
  try {
    [S.meta, S.collections] = await Promise.all([api('/api/meta'), api('/api/collections').catch(() => null)]);
  } catch (e) {
    if (e.message === 'auth') return renderAuthError();
  }
  await loadTab();
  // лента и статус обновляются сами
  setInterval(() => {
    const typing = document.activeElement?.matches?.('input');
    if (!S.editor && !S.sheet && !S.detail && !typing && S.tab !== 'filters') loadTab();
  }, 15000);
}
init();
</script>
</body>
</html>
